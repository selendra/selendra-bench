[package]
name = "selendra-bench"
version = "0.2.0"
edition = "2021"
authors = ["Selendra Network"]
description = "Enhanced benchmarking tool for Selendra Network"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
jsonrpsee = { version = "0.20", features = ["ws-client"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
hex = "0.4"
thiserror = "1.0"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"

